name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main # 监听 main 分支的推送
      - master # 兼容旧版本 Git 的主分支名
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 【极其关键】拉取 Blowfish 主题的源码
          fetch-depth: 0 # 抓取完整的 Git 历史（用于文章的“最后修改时间”功能）

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true # 必须为 true，Blowfish 主题依赖 SCSS 编译

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify            # 压缩打包生成的 HTML/CSS/JS

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public # 把 Hugo 生成的 public 文件夹打包传给 GitHub Pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
